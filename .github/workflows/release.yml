name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate version tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          MANIFEST_VERSION=$(grep -Po '(?<="version": ")[^"]*' custom_components/curgasnatural/manifest.json)

          echo "Tag version: $TAG_VERSION"
          echo "Manifest version: $MANIFEST_VERSION"

          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "Tag version ($TAG_VERSION) does not match manifest.json version ($MANIFEST_VERSION)"
            exit 1
          fi

          echo "✅ Version numbers match!"

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
        continue-on-error: true

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  test:
    # Must mirror the matrix in tests.yml: the two Home Assistant versions are
    # pinned in separate requirements files and need different interpreters, so a
    # single python-version matrix installing requirements-test.txt cannot work.
    # It silently did not — the 3.11 job failed to resolve and skipped the release.
    name: Run Tests (HA ${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "2024.3 (floor)"
            python-version: "3.11"
            requirements: requirements-test-min.txt
          - label: "2025.1 (current)"
            python-version: "3.12"
            requirements: requirements-test.txt

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.requirements }}

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create release archive
        run: |
          cd custom_components
          zip -r ../curgasnatural.zip curgasnatural/ -x "*.pyc" -x "*__pycache__*" -x "*.git*"
          cd ..
          echo "✅ Created curgasnatural.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: curgasnatural.zip
          draft: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
