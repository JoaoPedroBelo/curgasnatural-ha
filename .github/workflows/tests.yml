name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff Linter
        run: |
          ruff check custom_components/ tests/ scripts/ --output-format=github

      - name: Check Code Formatting (Ruff Format)
        run: |
          ruff format custom_components/ tests/ scripts/ --check --diff

      - name: Run MyPy (Type Checking)
        run: |
          mypy custom_components/curgasnatural --show-error-codes --pretty
        continue-on-error: true

  test:
    # Two Home Assistant versions, both pinned. The "min" job is what makes the
    # 2024.3.0+ floor in hacs.json and the README a tested fact instead of a guess;
    # the "current" job is what users actually run. Open version ranges were
    # resolving a different Home Assistant on every run, which made CI disagree
    # with local for reasons unrelated to the change under test.
    name: Run Tests (HA ${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "2024.3 (floor)"
            python-version: "3.11"
            requirements: requirements-test-min.txt
            coverage: false
          - label: "2025.1 (current)"
            python-version: "3.12"
            requirements: requirements-test.txt
            coverage: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.requirements }}

      - name: Show the resolved Home Assistant version
        run: python -c "from homeassistant.const import __version__ as v; print('Home Assistant', v)"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Run tests with coverage
        if: matrix.coverage
        run: |
          pytest tests/ --cov=custom_components.curgasnatural --cov-report=term-missing --cov-report=xml

      - name: Upload coverage reports
        if: matrix.coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true
